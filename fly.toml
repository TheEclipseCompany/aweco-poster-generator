# fly.toml app configuration file generated for aweco-poster-generator on 2026-08-02T20:06:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aweco-poster-generator'
primary_region = 'ams'

# Headroom for startup prerender spikes (docker-entrypoint runs the
# `generate` build phase on boot) without paying for a bigger VM.
swap_size_mb = 512

[build]

[http_service]
  # next start serves on 3000 (no PORT is set anywhere in the image).
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Sized for this app: ~13 MB of GeoJSON/TopoJSON parsed into memory at load,
# plus Next SSR and the on-boot prerender workers. 256 MB OOMs immediately;
# 2 GB + 2 shared CPUs holds the startup spike comfortably.
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
