# fly.toml app configuration file generated for aweco-poster-generator on 2026-08-02T20:06:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aweco-poster-generator'
primary_region = 'ams'

# Headroom for startup prerender spikes (docker-entrypoint runs the
# `generate` build phase on boot) without paying for a bigger VM.
swap_size_mb = 512

[build]

[http_service]
  # next start serves on 3000 (no PORT is set anywhere in the image).
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine hot: the imager hits the raw render route on demand and
  # a cold boot (image pull + on-boot prerender) costs ~25 s. The second
  # machine still scales to zero and wakes for overflow.
  min_machines_running = 1
  processes = ['app']

# Sized for this app: ~13 MB of GeoJSON/TopoJSON parsed into memory at load,
# plus Next SSR and the on-boot prerender workers. 256 MB OOMs immediately.
# 4 shared CPUs / 4 GB so several studio sessions + imager render calls can
# SSR the megabyte-scale poster SVGs concurrently without queueing.
[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 4
